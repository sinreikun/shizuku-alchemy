<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>"><title>しずく錬金工房 — 流体パズル</title></head>
<body>
<header><h1>💧 しずく錬金工房</h1><span class="sub">流れを設計する、セル流体パズル</span><span id="fps"></span></header>
<main>
  <aside class="left"><h2>ステージ</h2><div id="levels"></div></aside>
  <section class="stage">
    <div class="info"><h2 id="title"></h2><p id="story"></p><p id="hint"></p></div>
    <div class="wrap"><canvas id="view"></canvas>
      <div id="win" class="hidden"><div class="card"><div id="winstars"></div><h3>錬成成功！</h3><p id="winmsg"></p><button id="next">次のステージ ▶</button><button id="again">もう一度</button></div></div>
      <div id="toast"></div>
    </div>
  </section>
  <aside class="right">
    <h2>道具</h2><div id="tools"></div>
    <div class="ink">壁インク <b id="ink"></b><div class="bar"><i id="inkbar"></i></div></div>
    <div id="devs"></div>
    <h2>目標</h2><div id="goals"></div>
    <div id="flow"></div>
    <div class="btns"><button id="go" class="primary"></button><button id="speed">⏩ 1x</button><button id="retry" title="R">↺ 流し直し</button><button id="wipe">🧹 全消し</button></div>
    <p class="help">左ドラッグ: 描く ／ 右ドラッグ: 消す<br>Space: 放水・一時停止 ／ R: 流し直し</p>
  </aside>
</main>
<script type="module" src="/src/main.ts"></script>
</body></html>
